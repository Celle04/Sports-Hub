<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#90002b">
    <title>SNNHS SportsHub Offline</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #171717; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #fff8fa; }
        main { width: min(90%, 420px); padding: 32px; border: 1px solid #ece8ea; border-radius: 8px; background: #fff; text-align: center; box-shadow: 0 4px 16px #00000012; }
        img { width: 64px; height: 64px; object-fit: contain; }
        h1 { margin: 18px 0 8px; color: #90002b; font-size: 24px; }
        p { color: #77727a; line-height: 1.5; }
        button { padding: 11px 18px; border: 0; border-radius: 6px; color: #fff; background: #90002b; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/images/snnhs%20logo.png" alt="SNNHS logo">
        <h1>You are offline</h1>
        <p>Your saved SportsHub pages are still available. Reconnect to submit forms or load new information.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
